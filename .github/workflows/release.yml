name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: Publish the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install the platform required by compileSdk
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Prepare the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release keystore configured, falling back to the debug signature."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=$GITHUB_WORKSPACE/release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Assemble the release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/*.apk \
            --title "Naqaa $GITHUB_REF_NAME" \
            --generate-notes \
            --target "$GITHUB_SHA"
