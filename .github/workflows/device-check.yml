name: device check

# Starts the published file on an emulator of the chosen Android level and keeps what the
# device wrote. A failure that only happens on a phone has no other witness: the emulator
# produces the same trace, and the report is committed to a branch so that it can be read
# and compared between runs. The emulator is driven step by step rather than through a
# wrapper, so every line of its output is kept with the report.

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Android level to run the application on
        type: string
        default: '28'
      asset:
        description: Release tag whose file is tested, or "build" to use the current sources
        type: string
        default: v1.0.7
  # A change to this file checks the check itself. Only the default branch is watched, so
  # two runs never fight over the same emulator.
  push:
    branches: [main]
    paths:
      - '.github/workflows/device-check.yml'
  repository_dispatch:
    types: [device-check]

permissions:
  contents: write

env:
  API_LEVEL: ${{ github.event.inputs.api_level || github.event.client_payload.api_level || '28' }}
  ASSET: ${{ github.event.inputs.asset || github.event.client_payload.asset || 'v1.0.7' }}

jobs:
  run:
    name: Run on the emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Fetch the file under test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p under-test
          if [ "$ASSET" = "build" ]; then
            echo "::notice ::building the file from the current sources"
            ./gradlew --no-daemon assembleDebug > device-gradle.txt 2>&1 || tail -40 device-gradle.txt
            cp app/build/outputs/apk/debug/*.apk under-test/Naqaa.apk
          else
            echo "::notice ::downloading the published file of $ASSET"
            gh release download "$ASSET" -p '*.apk' -D under-test
            single="$(ls under-test/*.apk | head -1)"
            mv "$single" under-test/Naqaa.apk
          fi
          ls -l under-test | tee device-file.txt
          sha256sum under-test/Naqaa.apk | tee -a device-file.txt

      - name: Prepare the emulator
        run: |
          {
            echo "--- host"
            uname -a
            echo "--- hardware acceleration"
            ls -l /dev/kvm 2>&1
            egrep -c '(vmx|svm)' /proc/cpuinfo || true
            echo "--- packages"
            sdkmanager --install "platform-tools" "emulator" "system-images;android-$API_LEVEL;default;x86_64"
            echo "no" | avdmanager create avd -n naqaa -k "system-images;android-$API_LEVEL;default;x86_64" -d pixel --force
          } > device-emulator-setup.txt 2>&1
          tail -20 device-emulator-setup.txt

      - name: Install and launch the application
        run: |
          {
            echo "--- starting the emulator"
            nohup "$ANDROID_HOME/emulator/emulator" -avd naqaa -no-window -no-audio -no-boot-anim \
              -no-snapshot -gpu swiftshader_indirect -memory 2048 > device-emulator.txt 2>&1 &
            adb wait-for-device
            for attempt in $(seq 1 120); do
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              [ "$boot" = "1" ] && break
              sleep 5
            done
            echo "boot_completed=$(adb shell getprop sys.boot_completed | tr -d '\r')"
            echo "android=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "abis=$(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"
            echo "--- installing"
            adb install -r under-test/Naqaa.apk
            adb shell dumpsys package com.naqaa.app | grep -E "versionName|versionCode|firstInstallTime" || true
          } > device-install.txt 2>&1
          tail -12 device-install.txt

      - name: Watch the application start
        run: |
          {
            adb logcat -c
            echo "--- launch through the launcher entry"
            adb shell monkey -p com.naqaa.app -c android.intent.category.LAUNCHER 1
            sleep 25
            echo "--- process after the first launch"
            adb shell pidof com.naqaa.app || echo "not running"
            echo "--- crash buffer"
            adb logcat -d -b crash
          } > device-first-launch.txt 2>&1
          tail -40 device-first-launch.txt

      - name: Collect what the device wrote
        run: |
          {
            echo "--- second launch, which shows the failure text left by the first"
            adb shell am start -n com.naqaa.app/.ui.MainActivity
            sleep 12
            echo "--- process after the second launch"
            adb shell pidof com.naqaa.app || echo "not running"
            echo "--- crash buffer"
            adb logcat -d -b crash
            echo "--- lines that mention the application"
            adb logcat -d | grep -iE "naqaa|AndroidRuntime|FATAL|ActivityManager.*(died|Force|crash)" | tail -300
            echo "--- activity state"
            adb shell dumpsys activity activities | grep -i -B2 -A4 naqaa | head -60
          } > device-second-launch.txt 2>&1
          adb exec-out screencap -p > device-screen-1.png 2>/dev/null || true
          adb shell am start -n com.naqaa.app/.ui.MainActivity > /dev/null 2>&1 || true
          sleep 6
          adb exec-out screencap -p > device-screen-2.png 2>/dev/null || true
          {
            echo "--- files the application keeps"
            adb root > /dev/null 2>&1
            sleep 5
            adb shell 'ls -l /data/data/com.naqaa.app/files/' 2>&1
            echo "--- the failure it recorded"
            adb shell 'cat /data/data/com.naqaa.app/files/last-error.txt' 2>&1
            echo "--- the launch marker"
            adb shell 'cat /data/data/com.naqaa.app/files/last-launch.txt' 2>&1
          } > device-application-files.txt 2>&1
          tail -40 device-application-files.txt

      - name: Explain what the device reported
        if: always()
        run: |
          {
            echo "### Device check on Android $API_LEVEL with $ASSET"
            echo
            for file in device-file.txt device-install.txt device-first-launch.txt device-second-launch.txt device-application-files.txt device-emulator-setup.txt; do
              echo "===== $file"
              tail -c 4000 "$file" 2>/dev/null || echo "missing"
              echo
            done
          } > device-summary.txt
          cat device-summary.txt
          {
            echo '```'
            head -c 60000 device-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the report where it can be read
        if: always()
        run: |
          git config user.name "yswef"
          git config user.email "170477919+yswef@users.noreply.github.com"
          git checkout -B device-report || true
          git add -f device-*.txt device-screen-*.png || true
          git commit -q -m "device check on Android $API_LEVEL" || echo "nothing changed"
          if git push -f origin device-report; then
            echo "::notice ::the report is on the device-report branch"
          else
            echo "::warning ::the report could not be pushed to a branch"
          fi
          exit 0
