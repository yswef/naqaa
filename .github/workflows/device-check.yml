name: device check

# Runs the published file on an emulator of the chosen Android level and keeps what the
# device wrote. This is the only way to see a failure that happens on a phone and nowhere
# else: the emulator reports the same trace that the phone would, and the report is kept as
# an artifact so a crash can be read without asking anyone to copy it by hand.

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Android level to run the application on
        type: string
        default: '28'
      asset:
        description: Release tag whose file is tested, or "build" to use the current sources
        type: string
        default: v1.0.7
  # A push to this file checks the check itself; the event below is for tooling that cannot
  # use the manual dispatch.
  push:
    paths:
      - '.github/workflows/device-check.yml'
  repository_dispatch:
    types: [device-check]

permissions:
  contents: read

jobs:
  run:
    name: Run on the emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Fetch the file under test
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ github.event.inputs.asset || github.event.client_payload.asset || 'v1.0.7' }}
        run: |
          mkdir -p under-test
          if [ "$ASSET" = "build" ]; then
            echo "::notice ::building the file from the current sources"
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/*.apk under-test/Naqaa.apk
          else
            echo "::notice ::downloading the published file of $ASSET"
            gh release download "$ASSET" -p '*.apk' -D under-test
            single="$(ls under-test/*.apk | head -1)"
            mv "$single" under-test/Naqaa.apk
          fi
          ls -l under-test
          sha256sum under-test/Naqaa.apk | tee under-test/sha256.txt

      - name: Run the application and collect what the device wrote
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level || github.event.client_payload.api_level || '28' }}
          target: default
          arch: x86_64
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: |
            set -x
            adb shell getprop ro.build.version.sdk | tee device-android.txt
            adb shell getprop ro.product.cpu.abilist | tee device-abis.txt
            adb install -r under-test/Naqaa.apk 2>&1 | tee device-install.txt
            adb shell dumpsys package com.naqaa.app | grep -E "versionName|versionCode|firstInstallTime" | tee device-package.txt
            adb logcat -c

            # The launcher entry is what a tap on the icon starts, so it is tried first.
            adb shell monkey -p com.naqaa.app -c android.intent.category.LAUNCHER 1 2>&1 | tee device-launch-1.txt
            sleep 25
            {
              echo "--- after the first launch:"
              adb shell pidof com.naqaa.app || echo "not running"
            } | tee device-process.txt
            adb logcat -d -b crash > device-crash-1.txt
            adb exec-out screencap -p > device-screen-1.png

            # A second launch shows the failure text that the first one left behind.
            adb shell am start -n com.naqaa.app/.ui.MainActivity 2>&1 | tee device-launch-2.txt
            sleep 12
            {
              echo "--- after the second launch:"
              adb shell pidof com.naqaa.app || echo "not running"
            } | tee -a device-process.txt
            adb logcat -d -b crash > device-crash-2.txt
            adb exec-out screencap -p > device-screen-2.png
            adb logcat -d | grep -iE "naqaa|AndroidRuntime|FATAL|E ActivityManager|Force" | tail -400 > device-naqaa-lines.txt

            # The emulator image can be rooted, which is the only way to read the file the
            # application wrote about its own failure.
            adb root > /dev/null 2>&1 || true
            sleep 5
            adb shell 'ls -l /data/data/com.naqaa.app/files/ 2>&1' | tee device-files.txt
            adb shell 'cat /data/data/com.naqaa.app/files/last-error.txt 2>&1' | tee device-last-error.txt
            adb shell 'cat /data/data/com.naqaa.app/files/last-launch.txt 2>&1' | tee device-last-launch.txt
            adb shell 'cat /data/data/com.naqaa.app/databases/* 2>&1 | head -c 400' > device-databases.txt || true
            exit 0

      - name: Explain what the device reported
        if: always()
        run: |
          # The log of a run cannot be read from outside in some environments, and the step
          # summary cannot either, but annotations can. So the parts that matter are repeated
          # as annotations, and the same text stays in the file that keeps the report.
          annotate() {
            local title="$1" file="$2" text
            [ -f "$file" ] || return 0
            text="$(head -c 1900 "$file" | tr '\n' '~' | sed 's/%/%25/g; s/~/ | /g')"
            echo "::error title=$title::$text"
          }
          {
            echo "### Device check"
            echo
            echo "install: $(tail -2 device-install.txt 2>/dev/null | tr '\n' ' ')"
            echo "package: $(cat device-package.txt 2>/dev/null | tr '\n' ' ')"
            echo "state:   $(cat device-process.txt 2>/dev/null | tr '\n' ' ')"
          } | tee device-summary.txt
          annotate process device-process.txt
          annotate crash-first device-crash-1.txt
          annotate crash-second device-crash-2.txt
          annotate application-report device-last-error.txt
          annotate launch-marker device-last-launch.txt
          annotate launch-first device-launch-1.txt
          annotate application-lines device-naqaa-lines.txt
          {
            echo
            echo '```'
            cat device-summary.txt 2>/dev/null
            echo
            echo "--- crash buffer after the first launch"
            tail -c 3000 device-crash-1.txt 2>/dev/null
            echo "--- crash buffer after the second launch"
            tail -c 3000 device-crash-2.txt 2>/dev/null
            echo "--- the failure text the application wrote"
            head -c 2000 device-last-error.txt 2>/dev/null
            head -c 2000 device-last-launch.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the application is not running
        if: always()
        run: |
          if grep -q "not running" device-process.txt 2>/dev/null; then
            echo "::error ::the application was not running after the launch: it stopped on this device"
            exit 1
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-check-report
          path: |
            device-*.txt
            device-screen-*.png
            under-test/sha256.txt
          if-no-files-found: warn
