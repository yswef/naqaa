name: build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and assemble release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install the platform required by compileSdk
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Run the unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble the release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Report the APK size
        run: |
          du -h app/build/outputs/apk/release/*.apk
          ls -l app/build/outputs/apk/release/

      - name: Upload the release APK
        uses: actions/upload-artifact@v7
        with:
          name: naqaa-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
