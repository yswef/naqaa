name: build

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release from this run
        type: boolean
        default: false
      keystore_base64:
        description: Base64 of the release keystore, only needed when publishing
        required: false
        default: ''
      store_password:
        description: Keystore password
        required: false
        default: ''
      key_alias:
        description: Signing key alias
        required: false
        default: ''
      key_password:
        description: Signing key password
        required: false
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and assemble release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check the string resources
        run: python3 tools/check_strings.py

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4

      - name: Install the platform required by compileSdk
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" \
            || sdkmanager --install "platforms;android-36.1" "build-tools;36.0.0" \
            || sdkmanager --install "platforms;android-36.0" "build-tools;36.0.0"

      - name: Prepare the signing material
        id: signing
        env:
          KEYSTORE_BASE64: ${{ inputs.keystore_base64 }}
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          KEY_PASSWORD: ${{ inputs.key_password }}
        run: |
          store_password="$STORE_PASSWORD"
          key_alias="$KEY_ALIAS"
          key_password="$KEY_PASSWORD"
          if [ -z "$KEYSTORE_BASE64" ]; then
            store_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
            key_alias="naqaa"
            key_password="$store_password"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias "$key_alias" \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=yswef, O=Naqaa" \
              -storepass "$store_password" -keypass "$key_password"
            echo "ephemeral=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ephemeral=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"
          {
            echo "NAQAA_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "NAQAA_STORE_PASSWORD=$store_password"
            echo "NAQAA_KEY_ALIAS=$key_alias"
            echo "NAQAA_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Run the unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee unit-tests.log

      - name: Assemble the release build
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee assemble.log

      - name: Verify the release build
        id: verify
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          report="$RUNNER_TEMP/verify.txt"
          : > "$report"
          unsigned=0
          for apk in app/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk")"
            size="$(stat -c%s "$apk")"
            abis="$(unzip -l "$apk" | awk '{print $4}' | grep -oE '^lib/[^/]+/' | sort -u | sed 's|^lib/||; s|/$||' | paste -sd, -)"
            integrity=ok
            unzip -t "$apk" > /dev/null 2>&1 || integrity=damaged
            badging="$("$build_tools/aapt2" dump badging "$apk" 2>/dev/null \
              | grep -m1 -E "^package:" | sed 's/^package: //')"
            # Build tools name the field differently between versions: older ones print
            # sdkVersion, newer ones minSdkVersion, so both spellings are taken.
            sdks="$("$build_tools/aapt2" dump badging "$apk" 2>/dev/null \
              | grep -oE "(min|target)?[sS]dkVersion:'[0-9]+'" | paste -sd' ' -)"
            if "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signer.txt" 2>&1; then
              cert="$(grep -m1 -i 'SHA-256 digest' "$RUNNER_TEMP/signer.txt" | sed 's/^.*digest: *//')"
              schemes="$(grep -ci 'Verified using v[0-9].*scheme.*: true' "$RUNNER_TEMP/signer.txt")"
              signature="signed with $schemes scheme(s)"
            else
              cert="NOT SIGNED"
              signature="NOT SIGNED"
              unsigned=1
            fi
            digest="$(sha256sum "$apk" | cut -d' ' -f1)"
            printf '%s\n' "file: $name" >> "$report"
            printf '%s\n' "  size: $size bytes" >> "$report"
            printf '%s\n' "  architectures: ${abis:-none (code only)}" >> "$report"
            printf '%s\n' "  zip integrity: $integrity" >> "$report"
            printf '%s\n' "  signature: $signature" >> "$report"
            printf '%s\n' "  certificate sha-256: $cert" >> "$report"
            printf '%s\n' "  $sdks" >> "$report"
            printf '%s\n' "  schemes reported by apksigner:" >> "$report"
            grep -i 'Verified using' "$RUNNER_TEMP/signer.txt" | sed 's/^/    /' >> "$report"
            printf '%s\n' "  $badging" >> "$report"
            printf '%s\n' "  sha256 of the file: $digest" >> "$report"
            printf '%s\n\n' "" >> "$report"
          done
          cat "$report"
          {
            echo "### Release files"
            echo
            echo '```'
            cat "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$unsigned" -ne 0 ]; then
            echo "::error ::a release file is not signed and cannot be installed"
            exit 1
          fi

      - name: Report the failure
        if: steps.tests.outcome == 'failure' || steps.assemble.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          grep -hE "^(e|w): |error: |Execution failed|FAILED|Caused by" unit-tests.log assemble.log 2>/dev/null \
            | head -20 | awk '{print "::error ::" $0}'
          {
            echo "Run $RUN_ID on ${{ github.ref_name }}"
            echo
            echo "----- assembleRelease -----"
            tail -c 60000 assemble.log
            echo
            echo "----- unit tests -----"
            tail -c 40000 unit-tests.log
          } > failure.txt
          gh issue create --repo "$GITHUB_REPOSITORY" --title "build failure $RUN_ID" --body-file failure.txt

      - name: Stop when a build step failed
        if: steps.tests.outcome == 'failure' || steps.assemble.outcome == 'failure'
        run: exit 1

      - name: Report the release size
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = sorted(Path('app/build/outputs/apk/release').glob('*.apk'))
          if not paths:
              raise SystemExit('no release APK was produced')
          for path in paths:
              size = path.stat().st_size
              print(f'{path.name}: {size} bytes ({size / 1048576:.2f} MiB)')
              if size >= 6_000_000:
                  print(f'::warning ::{path.name} is above the 6 MB target')
          PY
          ls -l app/build/outputs/apk/release/

      - name: Upload the release build
        uses: actions/upload-artifact@v7
        with:
          name: naqaa-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Stage the release file
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          version="$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')"
          # One file in the release: the universal build carries both architectures, so
          # nobody has to know which processor the phone has. The smaller per-architecture
          # files stay in the run artifacts for whoever wants them.
          cp app/build/outputs/apk/release/app-universal-release.apk "$RUNNER_TEMP/dist/Naqaa-$version.apk"
          ls -l "$RUNNER_TEMP/dist"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          EPHEMERAL: ${{ steps.signing.outputs.ephemeral }}
        run: |
          if [ "$EPHEMERAL" = "true" ]; then
            printf '%s\n\n' 'The files were signed with a key created for this run, because no signing secret was handed to the workflow. They install normally, but a later release signed with a different key cannot replace them: uninstall the previous copy first, or hand the workflow a durable keystore through the manual dispatch inputs.' > "$RUNNER_TEMP/notes.md"
          else
            : > "$RUNNER_TEMP/notes.md"
          fi
          {
            printf '## التنزيل\n\n'
            printf 'ملف واحد فقط: **Naqaa-%s.apk**. يعمل على كل الهواتف، ٣٢-بت و٦٤-بت، فلا حاجة لمعرفة نوع معالج هاتفك.\n\n' "$VERSION"
            printf 'أندرويد ٨٫٠ أو أحدث. الملف موقّع ومفحوص قبل النشر، وبصمة `sha256` أدناه تكشف أي تنزيل ناقص.\n\n'
            printf 'إن كانت نسخة أقدم من التطبيق مثبتة على هاتفك فأزلْها أولا ثم ثبّت هذا الملف؛ كل إصدار يوقّع بمفتاح خاص به فلا يقبل أندرويد التثبيت فوق نسخة قديمة.\n\n'
            printf '## Download\n\n'
            printf 'One file: **Naqaa-%s.apk**, for 32-bit and 64-bit phones alike. Android 8.0 or newer.\n\n' "$VERSION"
            printf 'The file is about 1.6 MB. If Android refuses it, note the exact message and the file name and size shown on the phone.\n\n'
            printf 'If an older version is installed, remove it first: each release is signed with its own key, so Android will not install this file over an older one.\n\n'
            printf 'Checked with `apksigner` and `unzip` before publishing; the sha256 below shows whether a download arrived complete. The build also produces smaller per-architecture files, and those stay in the workflow artifacts instead of this page.\n\n'
            cat "$RUNNER_TEMP/notes.md"
            cat CHANGELOG.md
            printf '\n## Build details\n\n```\n'
            cat "$RUNNER_TEMP/verify.txt"
            printf '```\n'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "${GITHUB_REF_NAME}" "$RUNNER_TEMP/dist/Naqaa-$VERSION.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Naqaa ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
